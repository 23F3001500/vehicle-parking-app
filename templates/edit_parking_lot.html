{% extends "base.html" %}
{% block title %}Edit Parking Lot{% endblock %}
{% block body %}
<div class="container mt-4">
    <h2>Edit Parking Lot</h2>
    <form method="POST" action="{{ url_for('edit_parking_lot', lot_id=lot.id) }}">
        <div class="mb-3">
            <label for="name" class="form-label">Parking Lot Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ lot.name }}" required>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" name="address" required>{{ lot.address }}</textarea>
        </div>
        <div class="mb-3">
            <label for="pincode" class="form-label">Pincode</label>
            <input type="text" class="form-control" id="pincode" name="pincode" value="{{ lot.pincode }}" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price per hour (₹)</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ lot.price }}" required>
        </div>
        <div class="mb-3">
            <label for="max_spots" class="form-label">Maximum Spots</label>
            <input type="number" class="form-control" id="max_spots" name="max_spots" value="{{ lot.max_spots }}" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success me-2">Save Changes</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-danger">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
