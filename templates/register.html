{% extends "base.html" %}
{% block title %}User Registration{% endblock %}
{% block body %}
<div class="container mt-5">
    <h2 class="mb-4 text-center" style="color: #cc3366;">User Registration</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group mb-3">
            <label for="username">Username</label>
            <input name="username" class="form-control" required>
        </div>

        <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="form-group mb-4">
            <label for="vehicle_number">Vehicle Number</label>
            <input type="text" name="vehicle_number" class="form-control" placeholder="e.g. MP09 XY 1234" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn" style="background-color: #cc3366; color: white;">
                Register
            </button>
        </div>
    </form>

    <p class="mt-4 text-center" style="font-size: 16px; color: #555;">
        Already have an account? 
        <a href="{{ url_for('login') }}" 
           style="color: #cc3366; text-decoration: none; font-weight: 500;"
           onmouseover="this.style.textDecoration='underline'; this.style.color='#b32d5a';"
           onmouseout="this.style.textDecoration='none'; this.style.color='#cc3366';">
            Click here to login
        </a>
    </p>
</div>
{% endblock %}
