{% extends "base.html" %}
{% block title %}Create Parking Lot{% endblock %}
{% block body %}
<div class="container mt-5">
    <div class="p-4" style="background-color: white; border-radius: 12px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0" style="color: #cc3366; font-weight: bold;">Create Parking Lot</h2>
            <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background-color: #cc3366; color: white; font-weight: bold;">
                ← Back to Dashboard
            </a>
        </div>

        <form method="POST" action="{{ url_for('create_parking_lot') }}">
            <div class="form-group mb-3">
                <label for="name">Lot Name</label>
                <input name="name" id="name" type="text" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="address">Address</label>
                <input name="address" id="address" type="text" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="pincode">Pin Code</label>
                <input name="pincode" id="pincode" type="text" class="form-control" required>
            </div>

            <div class="form-group mb-3">
                <label for="price">Price per Hour</label>
                <input name="price" id="price" type="number" step="0.1" class="form-control" required>
            </div>

            <div class="form-group mb-4">
                <label for="num_spots">Number of Spots</label>
                <input name="num_spots" id="num_spots" type="number" class="form-control" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Create</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
